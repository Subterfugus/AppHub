<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>AppHub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="titlebar">
  <span class="brand"><span class="logo">a</span>AppHub</span>
  <div class="search-wrap">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search apps and settings, or describe a task" autocomplete="off" maxlength="300" aria-label="Search apps and Windows settings">
    <kbd>Ctrl K</kbd>
  </div>
  <span class="drag-zone"></span>
  <div class="window-controls">
    <button id="minimize" aria-label="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg></button>
    <button id="maximize" aria-label="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
    <button id="close" aria-label="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0 0 10"/></svg></button>
  </div>
</div>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-scroll"><nav id="navigation" aria-label="Sections"></nav></div>
    <div class="sidebar-bottom"><button id="preferences" class="nav-item"></button></div>
  </aside>
  <main>
    <div class="content" id="content">
      <header id="page-header"></header>
      <section id="body"></section>
    </div>
    <footer>
      <span id="sync-status">Reading your library…</span>
      <button id="refresh" class="status-button" title="Rescan installed apps"></button>
      <button id="job-status" class="status-button active hidden" title="Open Activity"><i class="status-dot"></i><span></span></button>
      <span class="spacer"></span>
      <span class="shortcut"><kbd>Ctrl</kbd> <kbd>Alt</kbd> <kbd>Space</kbd> shows AppHub</span>
      <button id="ai-status" class="status-button" title="Open local AI settings"><i class="status-dot"></i><span>Local AI asleep</span></button>
    </footer>
    <aside id="details" class="details hidden" aria-label="Application details"></aside>
  </main>
</div>
<dialog id="modal" aria-label="AppHub"><div id="modal-content"></div></dialog>
<div id="toast" role="status" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
