<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>AppHub</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="titlebar"><span class="title-brand"><span class="logo">a</span> AppHub <small>PERSONAL EDITION</small></span><span class="drag-zone"></span><button id="minimize" aria-label="Minimize">−</button><button id="maximize" aria-label="Maximize">□</button><button id="close" aria-label="Close">×</button></div>
<div class="shell"><aside class="sidebar"><div class="workspace"><span class="pc-icon">▣</span><div><strong>My workspace</strong><small id="computer">This PC · Windows 11</small></div><span class="dot"></span></div><div class="sidebar-scroll"><span class="nav-label">YOUR LIBRARY</span><nav id="navigation"></nav><div class="collections"><span class="nav-label">COLLECTIONS</span><div id="categories"></div></div></div><div class="sidebar-bottom"><button id="add-app" class="button subtle full">＋ Add application</button><div class="privacy-card"><span class="spark">✳</span><div><strong>Private by design</strong><small>Search stays on this PC.</small></div></div><button id="preferences" class="nav-item"><span class="nav-symbol">⚙</span><span class="nav-text">AppHub settings</span></button></div></aside>
<main><div class="toolbar"><div class="search-wrap"><span class="search-symbol">⌕</span><input id="search" type="search" placeholder="Search apps, settings, or describe what you need…" autocomplete="off" maxlength="300" aria-label="Search apps and Windows settings"><kbd>Ctrl K</kbd></div><button id="refresh" class="button subtle" title="Rescan installed apps">↻ <span>Sync library</span></button></div>
<div class="content" id="content"><header id="page-header"></header><section id="stats" class="stats"></section><section id="body"></section></div><footer><div><span class="dot"></span><span id="sync-status">Reading your library…</span></div><button id="ai-status" title="Open search model settings">✳ <span>Local AI asleep</span></button><span class="shortcut">Ctrl Alt Space · Bring AppHub forward</span></footer></main><aside id="details" class="details hidden" aria-label="Application details"></aside></div>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" class="toast hidden"></div><script src="app.js"></script></body></html>
